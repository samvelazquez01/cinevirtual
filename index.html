<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CineP2P — Sala de Cine en Tiempo Real (v6.0 USA/Móvil)</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #050608;
      --panel: rgba(18, 22, 33, 0.9);
      --border: rgba(255, 255, 255, 0.14);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* Pseudo-Fullscreen universal para celulares (iPhone Safari + Android) cuando el navegador bloquea la API nativa */
    .stage.pseudo-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      z-index: 99999 !important;
      background: #000 !important;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Barra superior flotante */
    .top-bar {
      position: absolute;
      top: 1rem;
      left: 1rem;
      right: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
      transition: opacity 0.35s ease;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .stage.hide-ui .top-bar,
    .stage.hide-ui .bottom-bar {
      opacity: 0;
      pointer-events: none;
    }

    .stage.hide-ui {
      cursor: none;
    }

    .pill {
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f59e0b;
    }

    .dot.live {
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    /* Tarjeta central de conexión / espera */
    .overlay-card {
      position: absolute;
      z-index: 15;
      background: var(--panel);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      width: 92%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      gap: 1.05rem;
    }

    .overlay-card h2 {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .overlay-card p {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.72rem 0.95rem;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.7rem 1.15rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.86rem;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      touch-action: manipulation;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 0.48rem 0.85rem;
      border-radius: 8px;
      font-size: 0.82rem;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      padding: 0.48rem 0.8rem;
      border-radius: 8px;
      font-size: 0.82rem;
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Botón flotante para desbloquear audio/video en Safari iOS y Chrome */
    .unmute-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 25;
      background: rgba(99, 102, 241, 0.96);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.35);
      padding: 1rem 1.65rem;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      gap: 0.6rem;
      white-space: nowrap;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.05); }
    }

    /* Controles inferiores del reproductor */
    .bottom-bar {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 2rem);
      max-width: 960px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.65rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      z-index: 20;
      transition: opacity 0.35s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      flex-wrap: wrap;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    input[type="range"] {
      width: 85px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Panel de estadísticas de calidad en vivo */
    .stats-popover {
      position: absolute;
      top: 4.2rem;
      right: 1rem;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1.05rem;
      font-size: 0.79rem;
      z-index: 22;
      display: none;
      min-width: 245px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      padding: 0.28rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      gap: 1rem;
    }

    .stats-row:last-child {
      border-bottom: none;
    }

    .stats-row span:first-child {
      color: var(--muted);
    }

    .stats-row span:last-child {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <div id="stage" class="stage">
    <!-- Barra Superior -->
    <div class="top-bar">
      <div class="pill">
        <span>🍿 CineP2P v6.0</span>
        <span style="color: var(--muted);">|</span>
        <div id="statusDot" class="dot"></div>
        <span id="statusLabel">Esperando sala...</span>
      </div>

      <div class="pill" style="gap: 0.45rem;">
        <span id="liveQualityBadge" style="color: #a5b4fc;">Conectando...</span>
        <button id="toggleStatsBtn" class="btn btn-ghost" style="padding: 0.28rem 0.6rem;">📊 Info Señal</button>
        <button id="dxBtn" class="btn btn-ghost" style="padding: 0.28rem 0.6rem;">🩺</button>
        <button id="leaveBtnTop" class="btn btn-danger" style="padding: 0.28rem 0.7rem; display: none;">🚪 Salir</button>
      </div>
    </div>

    <!-- Estadísticas detalladas -->
    <div id="statsPopover" class="stats-popover">
      <div class="stats-row">
        <span>Resolución:</span>
        <span id="statRes">—</span>
      </div>
      <div class="stats-row">
        <span>Framerate:</span>
        <span id="statFps">—</span>
      </div>
      <div class="stats-row">
        <span>Bitrate Video:</span>
        <span id="statBitrate">0.0 Mbps</span>
      </div>
      <div class="stats-row">
        <span>Bitrate Audio:</span>
        <span id="statAudioBitrate">0 kbps</span>
      </div>
      <div class="stats-row">
        <span>Latencia / Ruta:</span>
        <span id="statPing">— ms</span>
      </div>
    </div>

    <!-- Tarjeta de Conexión Inicial -->
    <div id="connectCard" class="overlay-card">
      <div style="font-size: 2.3rem;">🎬</div>
      <h2 id="cardTitle">Conectar a la Transmisión</h2>
      <p id="cardDesc">Introduce el código de la sala o abre directamente el enlace que te compartió el emisor.</p>
      <div class="input-row">
        <input type="text" id="roomInput" placeholder="Ej: sala-a1b2c" />
        <button id="joinBtn" class="btn">Entrar</button>
      </div>
    </div>

    <!-- Botón para activar sonido si el navegador bloqueó el audio automático -->
    <button id="unmuteBanner" class="unmute-banner">
      🔊 Toca aquí para activar el Audio Estéreo
    </button>

    <!-- Reproductor de Video Principal -->
    <video id="remoteVideo" autoplay playsinline webkit-playsinline></video>

    <!-- Barra Inferior de Controles -->
    <div class="bottom-bar">
      <div class="controls-group">
        <button id="muteBtn" class="btn btn-ghost" title="Silenciar / Activar sonido">🔊</button>
        <input id="volumeSlider" type="range" min="0" max="1" step="0.02" value="1" title="Volumen" />
        <span id="volumeLabel" style="font-size: 0.78rem; color: var(--muted); min-width: 36px;">100%</span>
      </div>

      <div class="controls-group">
        <button id="reconnectBtn" class="btn btn-ghost" title="Reconectar señal">🔄 Reconectar</button>
        <button id="zoomBtn" class="btn btn-ghost" title="Ajustar o Rellenar pantalla">🔍 Rellenar</button>
        <button id="fullscreenBtn" class="btn" style="padding: 0.48rem 0.9rem;">⛶ Pantalla Completa</button>
        <button id="leaveBtnBottom" class="btn btn-danger" title="Salir de la sala actual">🚪 Salir</button>
      </div>
    </div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const remoteVideo = document.getElementById('remoteVideo');
    const connectCard = document.getElementById('connectCard');
    const cardTitle = document.getElementById('cardTitle');
    const cardDesc = document.getElementById('cardDesc');
    const roomInput = document.getElementById('roomInput');
    const joinBtn = document.getElementById('joinBtn');
    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const liveQualityBadge = document.getElementById('liveQualityBadge');
    const unmuteBanner = document.getElementById('unmuteBanner');

    const muteBtn = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeLabel = document.getElementById('volumeLabel');
    const reconnectBtn = document.getElementById('reconnectBtn');
    const zoomBtn = document.getElementById('zoomBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const leaveBtnTop = document.getElementById('leaveBtnTop');
    const leaveBtnBottom = document.getElementById('leaveBtnBottom');
    const toggleStatsBtn = document.getElementById('toggleStatsBtn');
    const statsPopover = document.getElementById('statsPopover');

    const statRes = document.getElementById('statRes');
    const statFps = document.getElementById('statFps');
    const statBitrate = document.getElementById('statBitrate');
    const statAudioBitrate = document.getElementById('statAudioBitrate');
    const statPing = document.getElementById('statPing');

    let peer = null;
    let dataConn = null;
    let currentCall = null;
    let targetRoomId = null;
    let retryTimer = null;
    let dummyViewerStream = null;
    let hasReceivedFrames = false;
    let isAttemptingCall = false;
    let callStartedAt = 0;

    let lastVideoBytes = 0;
    let lastAudioBytes = 0;
    let lastStatsTime = performance.now();

    // Servidores STUN + TURN Norteamericanos (USA) y Globales en puertos 80 y 443 (UDP/TCP/TLS)
    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun.relay.metered.ca:80' },
        { urls: 'turn:global.relay.metered.ca:80', username: '0fbef837c9a591b641b5bc61', credential: 'hzp0YU55SlDsgtOd' },
        { urls: 'turn:global.relay.metered.ca:80?transport=tcp', username: '0fbef837c9a591b641b5bc61', credential: 'hzp0YU55SlDsgtOd' },
        { urls: 'turn:global.relay.metered.ca:443', username: '0fbef837c9a591b641b5bc61', credential: 'hzp0YU55SlDsgtOd' },
        { urls: 'turns:global.relay.metered.ca:443?transport=tcp', username: '0fbef837c9a591b641b5bc61', credential: 'hzp0YU55SlDsgtOd' },
      ],
      iceCandidatePoolSize: 0
    };

    // ===== TURN GRATIS (Metered Open Relay, 20 GB/mes) =====
    // Pega aqui tu URL: https://TUAPP.metered.live/api/v1/turn/credentials?apiKey=TU_API_KEY
    const TURN_API_URL = '';
    const rtcConfigReady = (async () => {
      if (!TURN_API_URL) { return; }
      try {
        const r = await fetch(TURN_API_URL);
        const list = await r.json();
        if (Array.isArray(list) && list.length) {
          rtcConfig.iceServers = [{ urls: 'stun:stun.l.google.com:19302' }, ...list];
          console.info('[CineP2P] Servidores ICE cargados:', list.length);
        }
      } catch (e) { console.warn('[CineP2P] No se pudo cargar TURN:', e); }
    })();

    function enhanceAnswerSdp(sdp) {
      if (!sdp) return sdp;
      return sdp.replace(
        /a=fmtp:(\d+) minptime=10;useinbandfec=1([^\r\n]*)/g,
        'a=fmtp:$1 minptime=10;useinbandfec=1;stereo=1;sprop-stereo=1;maxaveragebitrate=192000;maxplaybackrate=48000;cbr=1;usedtx=0$2'
      );
    }

    function getOrCreateViewerDummyStream() {
      if (dummyViewerStream) return dummyViewerStream;
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 2;
        canvas.height = 2;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 2, 2);
        const canvasStream = canvas.captureStream ? canvas.captureStream(1) : null;

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioCtx();
        const dst = audioCtx.createMediaStreamDestination();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        gain.gain.value = 0;
        osc.connect(gain);
        gain.connect(dst);
        osc.start();

        const tracks = [];
        if (canvasStream && canvasStream.getVideoTracks()[0]) {
          tracks.push(canvasStream.getVideoTracks()[0]);
        }
        if (dst.stream && dst.stream.getAudioTracks()[0]) {
          tracks.push(dst.stream.getAudioTracks()[0]);
        }
        dummyViewerStream = new MediaStream(tracks);
      } catch (e) {
        dummyViewerStream = new MediaStream();
      }
      return dummyViewerStream;
    }

    function leaveRoom() {
      clearInterval(retryTimer);
      hasReceivedFrames = false;
      isAttemptingCall = false;

      if (dataConn && dataConn.open) {
        try { dataConn.send({ type: 'VIEWER_LEFT' }); } catch (e) {}
      }
      if (currentCall) {
        try { currentCall.close(); } catch (e) {}
        currentCall = null;
      }
      if (dataConn) {
        try { dataConn.close(); } catch (e) {}
        dataConn = null;
      }
      if (peer) {
        try { peer.destroy(); } catch (e) {}
        peer = null;
      }

      remoteVideo.srcObject = null;
      targetRoomId = null;
      unmuteBanner.style.display = 'none';
      leaveBtnTop.style.display = 'none';

      const cleanUrl = new URL(window.location.href);
      cleanUrl.searchParams.delete('sala');
      cleanUrl.searchParams.delete('id');
      cleanUrl.searchParams.delete('room');
      window.history.replaceState({}, '', cleanUrl);

      statusDot.className = 'dot';
      statusLabel.textContent = 'Fuera de la sala';
      liveQualityBadge.textContent = 'Desconectado';
      statRes.textContent = '—';
      statFps.textContent = '—';
      statBitrate.textContent = '0.0 Mbps';
      statAudioBitrate.textContent = '0 kbps';
      statPing.textContent = '— ms';

      connectCard.style.display = 'flex';
      cardTitle.textContent = 'Has salido de la sala';
      cardDesc.textContent = 'Puedes introducir otro código de sala o volver a entrar cuando quieras.';
    }

    /**
     * En v6.0 NO ocultamos la tarjeta de carga hasta que el video realmente tenga fotogramas decodificados
     * (evento loadedmetadata / resize / bytes > 0), evitando que se quede en pantalla negra con "0.0 Mbps".
     */
    function handleIncomingRemoteStream(remoteStream, callObj) {
      if (!remoteStream) return;
      dlog('stream recibido');
      currentCall = callObj;

      if (remoteVideo.srcObject !== remoteStream) {
        remoteVideo.srcObject = remoteStream;
        remoteVideo.muted = true;
        remoteVideo.play().then(() => {
          unmuteBanner.style.display = 'flex';
          updateMuteUI();
        }).catch(() => {
          unmuteBanner.style.display = 'flex';
        });
      }

      cardTitle.textContent = 'Negociando ruta internacional de video...';
      cardDesc.textContent = 'Conectado con el emisor. Recibiendo primeros fotogramas de alta calidad...';
      statusLabel.textContent = `Recibiendo señal (${targetRoomId})...`;
    }

    remoteVideo.addEventListener('loadeddata', () => {
      if (remoteVideo.videoWidth > 0) {
        hasReceivedFrames = true;
        isAttemptingCall = false;
        connectCard.style.display = 'none';
        statusDot.className = 'dot live';
        statusLabel.textContent = `En Directo (${targetRoomId})`;
      }
    });

    function initiateDirectMediaCall() {
      if (!peer || !targetRoomId || hasReceivedFrames) return;

      // Si ya hay una llamada negociando candidatos ICE entre países, NO crear otra encima hasta que pasen 12 segundos o falle
      if (currentCall && currentCall.peerConnection) {
        const state = currentCall.peerConnection.connectionState;
        const age = Date.now() - callStartedAt;
        if (state === 'connected' || ((state === 'new' || state === 'connecting') && age < 30000)) {
          return;
        }
        try { currentCall.close(); } catch (e) {}
        currentCall = null;
      }

      try {
        isAttemptingCall = true;
        const dummy = getOrCreateViewerDummyStream();
        const outboundCall = peer.call(targetRoomId, dummy, {
          sdpTransform: enhanceAnswerSdp
        });
        if (!outboundCall) return;

        currentCall = outboundCall;
        callStartedAt = Date.now();
        dlog('llamando al emisor...');
        watchPC(outboundCall.peerConnection, 'video');
        outboundCall.on('stream', (remoteStream) => {
          handleIncomingRemoteStream(remoteStream, outboundCall);
        });
      } catch (e) {
        isAttemptingCall = false;
      }
    }

    async function connectToBroadcaster(roomId) {
      if (!roomId) return;
      clearInterval(retryTimer);
      hasReceivedFrames = false;
      isAttemptingCall = false;

      targetRoomId = roomId.trim();
      roomInput.value = targetRoomId;
      leaveBtnTop.style.display = 'inline-flex';

      const newUrl = new URL(window.location.href);
      newUrl.searchParams.set('sala', targetRoomId);
      window.history.replaceState({}, '', newUrl);

      cardTitle.textContent = 'Conectando a la sala...';
      cardDesc.textContent = `Estableciendo ruta directa con "${targetRoomId}"...`;
      statusDot.className = 'dot';
      statusLabel.textContent = `Sala: ${targetRoomId}`;

      if (peer) {
        try { peer.destroy(); } catch (e) {}
      }

      await rtcConfigReady;
      dlog('Conectando a sala ' + targetRoomId);
      setTimeout(() => { if (!hasReceivedFrames) { openDx(); testTurn('[viewer] '); } }, 20000);
      peer = new Peer({
        config: rtcConfig,
        debug: 1
      });

      peer.on('open', () => {
        dlog('señalización OK');
        openDataChannel();
        initiateDirectMediaCall();

        // Intervalo amplio (10 segundos) para dar tiempo a que el servidor TURN de EE. UU. termine el handshake ICE sin ser interrumpido
        clearInterval(retryTimer);
        retryTimer = setInterval(() => {
          if (!hasReceivedFrames && peer && !peer.destroyed) {
            const pcState = currentCall && currentCall.peerConnection ? currentCall.peerConnection.connectionState : 'none';
            const stale = Date.now() - callStartedAt > 30000;
            if (pcState === 'failed' || pcState === 'disconnected' || pcState === 'closed' || pcState === 'none' || stale) {
              try { if (currentCall) currentCall.close(); } catch (e) {}
              currentCall = null;
              if (dataConn && dataConn.open) {
                dataConn.send({ type: 'REQUEST_STREAM' });
              } else {
                openDataChannel();
              }
              initiateDirectMediaCall();
            }
          } else if (hasReceivedFrames) {
            clearInterval(retryTimer);
          }
        }, 8000);
      });

      // Si el emisor inicia o reinicia la transmisión y nos llama él a nosotros:
      peer.on('call', (incomingCall) => {
        if (currentCall && currentCall !== incomingCall) {
          try { currentCall.close(); } catch (e) {}
        }
        currentCall = incomingCall;

        incomingCall.answer(undefined, {
          sdpTransform: enhanceAnswerSdp
        });

        incomingCall.on('stream', (remoteStream) => {
          handleIncomingRemoteStream(remoteStream, incomingCall);
        });
      });

      peer.on('disconnected', () => { dlog('señalización caída, reconectando'); if (peer && !peer.destroyed) { try { peer.reconnect(); } catch (e) {} } });

      peer.on('error', (err) => {
        console.warn('Error Peer:', err);
        dlog('PeerJS error: ' + err.type + ' ' + (err.message || ''));
        openDx();
        if (!hasReceivedFrames) {
          statusDot.className = 'dot';
          statusLabel.textContent = 'Esperando señal...';
          connectCard.style.display = 'flex';
          cardTitle.textContent = 'Conectando con el Emisor...';
          cardDesc.textContent = `Sala "${targetRoomId}". Verifica que el emisor tenga activa la transmisión. (${err.type})`;
        }
      });
    }

    function openDataChannel() {
      if (!peer || !targetRoomId) return;
      if (dataConn && dataConn.open) return;
      if (dataConn) { try { dataConn.close(); } catch (e) {} }

      try {
        dataConn = peer.connect(targetRoomId, { reliable: true });
        watchPC(dataConn.peerConnection, 'datos');
        dataConn.on('error', (e) => dlog('datos error: ' + e.type));
        dataConn.on('open', () => dlog('canal de datos ABIERTO'));

        dataConn.on('open', () => {
          if (!hasReceivedFrames) {
            statusLabel.textContent = 'Sala conectada. Abriendo video...';
          }
        });

        dataConn.on('data', (data) => {
          if (!data) return;
          dlog('emisor dice: ' + data.type);
          if (data.type === 'WAITING_STREAM') {
            cardTitle.textContent = 'Dentro de la sala — Esperando película';
            cardDesc.textContent = 'Conectado correctamente. En cuanto el emisor pulse "Transmitir Pantalla", verás la imagen.';
          } else if (data.type === 'STREAM_READY') {
            if (!hasReceivedFrames) {
              initiateDirectMediaCall();
            }
          } else if (data.type === 'STREAM_STOPPED') {
            hasReceivedFrames = false;
            remoteVideo.srcObject = null;
            connectCard.style.display = 'flex';
            cardTitle.textContent = 'Captura en pausa';
            cardDesc.textContent = 'El emisor detuvo la captura temporalmente.';
          } else if (data.type === 'PAUSED') {
            showPauseToast('⏸ El emisor pausó la película');
          } else if (data.type === 'PLAYING') {
            showPauseToast('');
          } else if (data.type === 'ROOM_CLOSED') {
            leaveRoom();
            cardTitle.textContent = 'El emisor cerró la sala';
            cardDesc.textContent = 'La sesión ha finalizado.';
          }
        });
      } catch (e) {}
    }

    // Desbloqueo de audio
    unmuteBanner.addEventListener('click', () => {
      remoteVideo.muted = false;
      remoteVideo.volume = parseFloat(volumeSlider.value) || 1;
      remoteVideo.play().catch(() => {});
      unmuteBanner.style.display = 'none';
      updateMuteUI();
    });

    function updateMuteUI() {
      if (remoteVideo.muted || remoteVideo.volume === 0) {
        muteBtn.textContent = '🔇';
      } else {
        muteBtn.textContent = '🔊';
      }
    }

    muteBtn.addEventListener('click', () => {
      remoteVideo.muted = !remoteVideo.muted;
      if (!remoteVideo.muted) {
        remoteVideo.play().catch(() => {});
        unmuteBanner.style.display = 'none';
      }
      updateMuteUI();
    });

    volumeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      remoteVideo.volume = val;
      remoteVideo.muted = val === 0;
      volumeLabel.textContent = `${Math.round(val * 100)}%`;
      if (val > 0) {
        unmuteBanner.style.display = 'none';
      }
      updateMuteUI();
    });

    // Botón para alternar entre ver la película completa (contain) o rellenar toda la pantalla del celular (cover)
    zoomBtn.addEventListener('click', () => {
      if (remoteVideo.style.objectFit === 'cover') {
        remoteVideo.style.objectFit = 'contain';
        zoomBtn.innerHTML = '🔍 Rellenar';
      } else {
        remoteVideo.style.objectFit = 'cover';
        zoomBtn.innerHTML = '📐 Ajustar';
      }
    });

    /**
     * PANTALLA COMPLETA UNIVERSAL PARA CELULARES (iOS Safari + Chrome Android + PC):
     * 1) Intenta Fullscreen estándar sobre el contenedor.
     * 2) Si es iPhone (Safari iOS), usa webkitEnterFullscreen() directamente sobre el elemento <video>.
     * 3) Si el navegador móvil bloquea ambos, activa el modo pantalla completa inmersivo CSS y bloquea orientación horizontal.
     */
    async function toggleMobileAndDesktopFullscreen() {
      try {
        // Caso 1: Salir si ya estamos en Fullscreen estándar o pseudo-fullscreen
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          if (document.exitFullscreen) await document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          return;
        }

        if (stage.classList.contains('pseudo-fullscreen')) {
          stage.classList.remove('pseudo-fullscreen');
          stage.classList.remove('hide-ui');
          fullscreenBtn.innerHTML = '⛶ Pantalla Completa';
          return;
        }

        // Caso 2: API estándar (PC y Android)
        if (stage.requestFullscreen) {
          await stage.requestFullscreen();
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
          }
          return;
        }

        if (stage.webkitRequestFullscreen) {
          stage.webkitRequestFullscreen();
          return;
        }

        // Caso 3: iPhone / Safari iOS nativo sobre el elemento <video>
        if (remoteVideo.webkitEnterFullscreen) {
          remoteVideo.webkitEnterFullscreen();
          return;
        }
      } catch (err) {
        // Fallback: Si Safari iOS aún no permite webkitEnterFullscreen o falla la promesa, intentar sobre el video o usar modo inmersivo
        if (remoteVideo.webkitEnterFullscreen) {
          try {
            remoteVideo.webkitEnterFullscreen();
            return;
          } catch (e2) {}
        }
      }

      // Caso 4: Modo inmersivo en pantalla completa para cualquier navegador móvil
      stage.classList.add('pseudo-fullscreen');
      fullscreenBtn.innerHTML = '✕ Salir Pantalla Completa';
      window.scrollTo(0, 1);
    }

    fullscreenBtn.addEventListener('click', toggleMobileAndDesktopFullscreen);

    remoteVideo.addEventListener('dblclick', toggleMobileAndDesktopFullscreen);

    reconnectBtn.addEventListener('click', () => {
      const code = targetRoomId || roomInput.value.trim();
      if (code) {
        currentCall = null;
        connectToBroadcaster(code);
      }
    });

    leaveBtnTop.addEventListener('click', leaveRoom);
    leaveBtnBottom.addEventListener('click', leaveRoom);

    toggleStatsBtn.addEventListener('click', () => {
      const visible = statsPopover.style.display === 'block';
      statsPopover.style.display = visible ? 'none' : 'block';
    });

    joinBtn.addEventListener('click', () => {
      const code = roomInput.value.trim();
      if (code) {
        connectToBroadcaster(code);
      }
    });

    roomInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        joinBtn.click();
      }
    });

    // Auto-ocultar controles en PC y al tocar la pantalla en celulares
    let uiTimeout = null;
    function showUiTemporarily() {
      stage.classList.remove('hide-ui');
      clearTimeout(uiTimeout);
      if (connectCard.style.display === 'none') {
        uiTimeout = setTimeout(() => {
          if (statsPopover.style.display !== 'block') {
            stage.classList.add('hide-ui');
          }
        }, 3200);
      }
    }

    stage.addEventListener('mousemove', showUiTemporarily);
    stage.addEventListener('touchstart', (e) => {
      if (e.target === remoteVideo || e.target === stage) {
        if (stage.classList.contains('hide-ui')) {
          showUiTemporarily();
        } else if (connectCard.style.display === 'none') {
          stage.classList.add('hide-ui');
        }
      } else {
        showUiTemporarily();
      }
    }, { passive: true });

    // Telemetría de recepción en vivo
    setInterval(async () => {
      if (!currentCall || !currentCall.peerConnection) return;

      try {
        const stats = await currentCall.peerConnection.getStats();
        const now = performance.now();
        const elapsedSec = (now - lastStatsTime) / 1000;

        stats.forEach(report => {
          if (report.type === 'inbound-rtp' && report.kind === 'video') {
            const bytes = report.bytesReceived || 0;
            if (bytes > 2000 && !hasReceivedFrames) {
              hasReceivedFrames = true;
              connectCard.style.display = 'none';
              statusDot.className = 'dot live';
              statusLabel.textContent = `En Directo (${targetRoomId})`;
            }
            if (elapsedSec > 0 && lastVideoBytes > 0) {
              const mbps = (((bytes - lastVideoBytes) * 8) / elapsedSec / 1_000_000).toFixed(2);
              statBitrate.textContent = `${mbps} Mbps`;
              liveQualityBadge.textContent = `${report.frameHeight ? report.frameHeight + 'p' : 'HD'} • ${mbps} Mbps`;
            }
            lastVideoBytes = bytes;

            if (report.frameWidth && report.frameHeight) {
              statRes.textContent = `${report.frameWidth}×${report.frameHeight}`;
            }
            if (report.framesPerSecond !== undefined) {
              statFps.textContent = `${Math.round(report.framesPerSecond)} FPS`;
            }
          }

          if (report.type === 'inbound-rtp' && report.kind === 'audio') {
            const bytes = report.bytesReceived || 0;
            if (elapsedSec > 0 && lastAudioBytes > 0) {
              const kbps = Math.round(((bytes - lastAudioBytes) * 8) / elapsedSec / 1000);
              statAudioBitrate.textContent = `${kbps} kbps Estéreo`;
            }
            lastAudioBytes = bytes;
          }

          if (report.type === 'candidate-pair' && report.state === 'succeeded' && report.nominated && report.currentRoundTripTime !== undefined) {
            const lc = stats.get(report.localCandidateId), rc = stats.get(report.remoteCandidateId);
            const relayed = (lc && lc.candidateType === 'relay') || (rc && rc.candidateType === 'relay');
            statPing.textContent = `${Math.round(report.currentRoundTripTime * 1000)} ms · ${relayed ? 'Relay TURN' : 'Directo'}`;
          }
        });

        lastStatsTime = now;
      } catch (e) {}
    }, 1000);

    // Evitar que el celular se apague durante la película
    let wakeLock = null;
    async function requestWakeLock() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {} }
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && hasReceivedFrames) requestWakeLock(); });
    remoteVideo.addEventListener('loadeddata', requestWakeLock);

    // Aviso cuando el emisor pausa
    const pauseToast = document.createElement('div');
    pauseToast.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:24;background:rgba(0,0,0,.75);color:#fff;padding:.8rem 1.4rem;border-radius:999px;font-weight:700;display:none;';
    stage.appendChild(pauseToast);
    function showPauseToast(t) { pauseToast.textContent = t; pauseToast.style.display = t ? 'block' : 'none'; }

    // ===== DIAGNÓSTICO (botón 🩺) =====
    const dlogLines = [];
    const dlogBox = document.createElement('pre');
    dlogBox.style.cssText = 'position:absolute;top:4.2rem;left:1rem;right:1rem;max-height:55vh;overflow:auto;z-index:40;background:rgba(0,0,0,.9);color:#a7f3d0;font:11px/1.35 monospace;padding:.7rem;border-radius:10px;display:none;white-space:pre-wrap;user-select:text;';
    stage.appendChild(dlogBox);
    function dlog(m) { dlogLines.push(new Date().toLocaleTimeString() + ' ' + m); if (dlogLines.length > 80) dlogLines.shift(); dlogBox.textContent = dlogLines.join('\n'); dlogBox.scrollTop = dlogBox.scrollHeight; console.log('[dx]', m); }
    function openDx() { dlogBox.style.display = 'block'; }
    function watchPC(pc, label) {
      if (!pc || pc._dx) return; pc._dx = true;
      const c = {};
      pc.addEventListener('icecandidate', e => { if (e.candidate) { const t = e.candidate.type || '?'; c[t] = (c[t] || 0) + 1; } else dlog(label + ' candidatos locales: ' + JSON.stringify(c)); });
      pc.addEventListener('icecandidateerror', e => dlog(label + ' ICE error ' + e.errorCode + ' ' + (e.url || '') + ' ' + (e.errorText || '')));
      pc.addEventListener('iceconnectionstatechange', () => dlog(label + ' ice=' + pc.iceConnectionState));
      pc.addEventListener('connectionstatechange', () => dlog(label + ' conn=' + pc.connectionState));
    }
    async function testTurn(label) {
      dlog(label + 'probando TURN (solo relay)...');
      try {
        const pc = new RTCPeerConnection({ iceServers: rtcConfig.iceServers, iceTransportPolicy: 'relay' });
        let relay = 0; const errs = [];
        pc.addEventListener('icecandidate', e => { if (e.candidate && e.candidate.type === 'relay') relay++; });
        pc.addEventListener('icecandidateerror', e => errs.push(e.errorCode + ' ' + (e.url || '')));
        pc.createDataChannel('t');
        await pc.setLocalDescription(await pc.createOffer());
        await new Promise(r => { const t = setTimeout(r, 6000); pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); r(); } }); });
        pc.close();
        dlog(label + (relay ? 'TURN OK (' + relay + ' relay)' : 'TURN FALLA: 0 relay. Errores: ' + (errs.join(' | ') || 'ninguno')));
      } catch (e) { dlog(label + 'prueba TURN error: ' + e); }
    }
    document.getElementById('dxBtn').addEventListener('click', () => {
      const show = dlogBox.style.display !== 'block';
      dlogBox.style.display = show ? 'block' : 'none';
      if (show) testTurn('[viewer] ');
    });

    // Leer automáticamente ?sala=... de la URL al abrir el enlace
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const roomFromUrl = params.get('sala') || params.get('id') || params.get('room');
      if (roomFromUrl) {
        roomInput.value = roomFromUrl;
        connectToBroadcaster(roomFromUrl);
      }
    });
  </script>
</body>
</html>
