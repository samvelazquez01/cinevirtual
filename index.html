<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineP2P — Sala de Cine en Tiempo Real (v5.0)</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #050608;
      --panel: rgba(18, 22, 33, 0.9);
      --border: rgba(255, 255, 255, 0.14);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0f131f 0%, #050608 100%);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Barra superior flotante */
    .top-bar {
      position: absolute;
      top: 1.25rem;
      left: 1.5rem;
      right: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
      transition: opacity 0.35s ease;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .stage.hide-ui .top-bar,
    .stage.hide-ui .bottom-bar {
      opacity: 0;
    }

    .stage.hide-ui {
      cursor: none;
    }

    .pill {
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f59e0b;
    }

    .dot.live {
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    /* Tarjeta central de conexión / espera */
    .overlay-card {
      position: absolute;
      z-index: 15;
      background: var(--panel);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      width: 92%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .overlay-card h2 {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .overlay-card p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 0.83rem;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      font-size: 0.83rem;
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Botón flotante para desbloquear audio/video en Safari iOS y Chrome */
    .unmute-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 25;
      background: rgba(99, 102, 241, 0.96);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.35);
      padding: 1.05rem 1.85rem;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      gap: 0.65rem;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.05); }
    }

    /* Controles inferiores del reproductor */
    .bottom-bar {
      position: absolute;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 3rem);
      max-width: 960px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.7rem 1.15rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      z-index: 20;
      transition: opacity 0.35s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      flex-wrap: wrap;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    input[type="range"] {
      width: 95px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Panel de estadísticas de calidad en vivo */
    .stats-popover {
      position: absolute;
      top: 4.5rem;
      right: 1.5rem;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem 1.1rem;
      font-size: 0.8rem;
      z-index: 22;
      display: none;
      min-width: 240px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      padding: 0.28rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      gap: 1rem;
    }

    .stats-row:last-child {
      border-bottom: none;
    }

    .stats-row span:first-child {
      color: var(--muted);
    }

    .stats-row span:last-child {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <div id="stage" class="stage">
    <!-- Barra Superior -->
    <div class="top-bar">
      <div class="pill">
        <span>🍿 CineP2P v5.0</span>
        <span style="color: var(--muted);">|</span>
        <div id="statusDot" class="dot"></div>
        <span id="statusLabel">Esperando sala...</span>
      </div>

      <div class="pill" style="gap: 0.5rem;">
        <span id="liveQualityBadge" style="color: #a5b4fc;">Directo P2P</span>
        <button id="toggleStatsBtn" class="btn btn-ghost" style="padding: 0.28rem 0.65rem;">📊 Info Señal</button>
        <button id="leaveBtnTop" class="btn btn-danger" style="padding: 0.28rem 0.75rem; display: none;">🚪 Salir de Sala</button>
      </div>
    </div>

    <!-- Estadísticas detalladas -->
    <div id="statsPopover" class="stats-popover">
      <div class="stats-row">
        <span>Resolución:</span>
        <span id="statRes">—</span>
      </div>
      <div class="stats-row">
        <span>Framerate:</span>
        <span id="statFps">—</span>
      </div>
      <div class="stats-row">
        <span>Bitrate Video:</span>
        <span id="statBitrate">0.0 Mbps</span>
      </div>
      <div class="stats-row">
        <span>Bitrate Audio:</span>
        <span id="statAudioBitrate">0 kbps</span>
      </div>
      <div class="stats-row">
        <span>Latencia (Ping):</span>
        <span id="statPing">— ms</span>
      </div>
    </div>

    <!-- Tarjeta de Conexión Inicial -->
    <div id="connectCard" class="overlay-card">
      <div style="font-size: 2.4rem;">🎬</div>
      <h2 id="cardTitle">Conectar a la Transmisión</h2>
      <p id="cardDesc">Introduce el código de la sala o abre directamente el enlace que te compartió el emisor.</p>
      <div class="input-row">
        <input type="text" id="roomInput" placeholder="Ej: sala-a1b2c" />
        <button id="joinBtn" class="btn">Entrar</button>
      </div>
    </div>

    <!-- Botón para activar sonido si el navegador bloqueó el audio automático -->
    <button id="unmuteBanner" class="unmute-banner">
      🔊 Toca aquí para activar el Audio Estéreo y Video
    </button>

    <!-- Reproductor de Video Principal -->
    <video id="remoteVideo" autoplay playsinline webkit-playsinline></video>

    <!-- Barra Inferior de Controles -->
    <div class="bottom-bar">
      <div class="controls-group">
        <button id="muteBtn" class="btn btn-ghost" title="Silenciar / Activar sonido">🔊</button>
        <input id="volumeSlider" type="range" min="0" max="1" step="0.02" value="1" title="Volumen" />
        <span id="volumeLabel" style="font-size: 0.8rem; color: var(--muted); min-width: 38px;">100%</span>
      </div>

      <div class="controls-group">
        <button id="reconnectBtn" class="btn btn-ghost" title="Reconectar señal">🔄 Reconectar</button>
        <button id="pipBtn" class="btn btn-ghost" title="Modo ventana flotante">🖼️ PiP</button>
        <button id="fullscreenBtn" class="btn" style="padding: 0.5rem 0.95rem;">⛶ Pantalla Completa</button>
        <button id="leaveBtnBottom" class="btn btn-danger" title="Salir de la sala actual">🚪 Salir de Sala</button>
      </div>
    </div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const remoteVideo = document.getElementById('remoteVideo');
    const connectCard = document.getElementById('connectCard');
    const cardTitle = document.getElementById('cardTitle');
    const cardDesc = document.getElementById('cardDesc');
    const roomInput = document.getElementById('roomInput');
    const joinBtn = document.getElementById('joinBtn');
    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const liveQualityBadge = document.getElementById('liveQualityBadge');
    const unmuteBanner = document.getElementById('unmuteBanner');

    const muteBtn = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeLabel = document.getElementById('volumeLabel');
    const reconnectBtn = document.getElementById('reconnectBtn');
    const pipBtn = document.getElementById('pipBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const leaveBtnTop = document.getElementById('leaveBtnTop');
    const leaveBtnBottom = document.getElementById('leaveBtnBottom');
    const toggleStatsBtn = document.getElementById('toggleStatsBtn');
    const statsPopover = document.getElementById('statsPopover');

    const statRes = document.getElementById('statRes');
    const statFps = document.getElementById('statFps');
    const statBitrate = document.getElementById('statBitrate');
    const statAudioBitrate = document.getElementById('statAudioBitrate');
    const statPing = document.getElementById('statPing');

    let peer = null;
    let dataConn = null;
    let currentCall = null;
    let targetRoomId = null;
    let retryTimer = null;
    let dummyViewerStream = null;
    let hasReceivedFrames = false;

    let lastVideoBytes = 0;
    let lastAudioBytes = 0;
    let lastStatsTime = performance.now();

    // Servidores STUN + TURN Internacionales redundantes (Puertos 80 y 443 UDP/TCP/TLS)
    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' },
        {
          urls: [
            'turn:openrelay.metered.ca:80',
            'turn:openrelay.metered.ca:80?transport=tcp',
            'turn:openrelay.metered.ca:443',
            'turn:openrelay.metered.ca:443?transport=tcp',
            'turns:openrelay.metered.ca:443?transport=tcp'
          ],
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: [
            'turn:standard.relay.metered.ca:80',
            'turn:standard.relay.metered.ca:80?transport=tcp',
            'turn:standard.relay.metered.ca:443',
            'turn:standard.relay.metered.ca:443?transport=tcp',
            'turns:standard.relay.metered.ca:443?transport=tcp'
          ],
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ],
      iceCandidatePoolSize: 10
    };

    function enhanceAnswerSdp(sdp) {
      if (!sdp) return sdp;
      return sdp.replace(
        /a=fmtp:(\d+) minptime=10;useinbandfec=1([^\r\n]*)/g,
        'a=fmtp:$1 minptime=10;useinbandfec=1;stereo=1;sprop-stereo=1;maxaveragebitrate=510000;maxplaybackrate=48000;cbr=1;usedtx=0$2'
      );
    }

    /**
     * Crea un stream silencioso/vacío ultra-ligero (1x1px + silencio) sin pedir permisos de cámara/micrófono.
     * Esto permite que el espectador llame directamente al emisor con peer.call(targetRoomId, dummyStream)
     * negociando las líneas m=video y m=audio a través de cualquier NAT/Firewall internacional o Safari iOS.
     */
    function getOrCreateViewerDummyStream() {
      if (dummyViewerStream) return dummyViewerStream;
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 2;
        canvas.height = 2;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 2, 2);
        const canvasStream = canvas.captureStream ? canvas.captureStream(1) : null;

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioCtx();
        const dst = audioCtx.createMediaStreamDestination();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        gain.gain.value = 0; // 100% silencio
        osc.connect(gain);
        gain.connect(dst);
        osc.start();

        const tracks = [];
        if (canvasStream && canvasStream.getVideoTracks()[0]) {
          tracks.push(canvasStream.getVideoTracks()[0]);
        }
        if (dst.stream && dst.stream.getAudioTracks()[0]) {
          tracks.push(dst.stream.getAudioTracks()[0]);
        }
        dummyViewerStream = new MediaStream(tracks);
      } catch (e) {
        dummyViewerStream = new MediaStream();
      }
      return dummyViewerStream;
    }

    function leaveRoom() {
      clearInterval(retryTimer);
      hasReceivedFrames = false;

      if (dataConn && dataConn.open) {
        try { dataConn.send({ type: 'VIEWER_LEFT' }); } catch (e) {}
      }
      if (currentCall) {
        try { currentCall.close(); } catch (e) {}
        currentCall = null;
      }
      if (dataConn) {
        try { dataConn.close(); } catch (e) {}
        dataConn = null;
      }
      if (peer) {
        try { peer.destroy(); } catch (e) {}
        peer = null;
      }

      remoteVideo.srcObject = null;
      targetRoomId = null;
      unmuteBanner.style.display = 'none';
      leaveBtnTop.style.display = 'none';

      const cleanUrl = new URL(window.location.href);
      cleanUrl.searchParams.delete('sala');
      cleanUrl.searchParams.delete('id');
      cleanUrl.searchParams.delete('room');
      window.history.replaceState({}, '', cleanUrl);

      statusDot.className = 'dot';
      statusLabel.textContent = 'Fuera de la sala';
      liveQualityBadge.textContent = 'Desconectado';
      statRes.textContent = '—';
      statFps.textContent = '—';
      statBitrate.textContent = '0.0 Mbps';
      statAudioBitrate.textContent = '0 kbps';
      statPing.textContent = '— ms';

      connectCard.style.display = 'flex';
      cardTitle.textContent = 'Has salido de la sala';
      cardDesc.textContent = 'Puedes introducir otro código de sala o volver a entrar cuando quieras.';
    }

    function handleIncomingRemoteStream(remoteStream, callObj) {
      if (!remoteStream) return;
      currentCall = callObj;

      // IMPORTANTE PARA SAFARI iOS: Empezar silenciado (muted=true) para que Safari renderice el video inmediatamente y no lo deje en negro
      remoteVideo.srcObject = remoteStream;
      remoteVideo.muted = true;
      remoteVideo.play().then(() => {
        // Mostrar botón grande para activar el sonido con un toque del usuario (requerido por Safari/iOS y Chrome móvil)
        unmuteBanner.style.display = 'flex';
        updateMuteUI();
      }).catch(() => {
        unmuteBanner.style.display = 'flex';
      });

      connectCard.style.display = 'none';
      statusDot.className = 'dot live';
      statusLabel.textContent = `En Directo (${targetRoomId})`;
    }

    function initiateDirectMediaCall() {
      if (!peer || !targetRoomId || hasReceivedFrames) return;
      try {
        const dummy = getOrCreateViewerDummyStream();
        const outboundCall = peer.call(targetRoomId, dummy, {
          sdpTransform: enhanceAnswerSdp
        });
        if (!outboundCall) return;

        outboundCall.on('stream', (remoteStream) => {
          handleIncomingRemoteStream(remoteStream, outboundCall);
        });
      } catch (e) {
        console.warn('Intento de llamada directa:', e);
      }
    }

    function connectToBroadcaster(roomId) {
      if (!roomId) return;
      clearInterval(retryTimer);
      hasReceivedFrames = false;

      targetRoomId = roomId.trim();
      roomInput.value = targetRoomId;
      leaveBtnTop.style.display = 'inline-flex';

      const newUrl = new URL(window.location.href);
      newUrl.searchParams.set('sala', targetRoomId);
      window.history.replaceState({}, '', newUrl);

      cardTitle.textContent = 'Conectando a la sala...';
      cardDesc.textContent = `Estableciendo conexión internacional con "${targetRoomId}"...`;
      statusDot.className = 'dot';
      statusLabel.textContent = `Sala: ${targetRoomId}`;

      if (peer) {
        try { peer.destroy(); } catch (e) {}
      }

      peer = new Peer({
        config: rtcConfig,
        debug: 1
      });

      peer.on('open', () => {
        // 1. Iniciar canal de datos Y TAMBIÉN llamada directa de medios (doble vía para atravesar cualquier firewall/país)
        openDataChannel();
        initiateDirectMediaCall();

        // Reintentar cada 3.5 segundos mientras no estén entrando bytes reales de video
        clearInterval(retryTimer);
        retryTimer = setInterval(() => {
          if (!hasReceivedFrames && peer && !peer.destroyed) {
            if (dataConn && dataConn.open) {
              dataConn.send({ type: 'REQUEST_STREAM' });
            } else {
              openDataChannel();
            }
            initiateDirectMediaCall();
          } else if (hasReceivedFrames) {
            clearInterval(retryTimer);
          }
        }, 3500);
      });

      // 2. Si el emisor nos devuelve la llamada hacia nosotros, también la aceptamos
      peer.on('call', (incomingCall) => {
        incomingCall.answer(undefined, {
          sdpTransform: enhanceAnswerSdp
        });

        incomingCall.on('stream', (remoteStream) => {
          handleIncomingRemoteStream(remoteStream, incomingCall);
        });
      });

      peer.on('error', (err) => {
        console.warn('Error Peer:', err);
        if (!hasReceivedFrames) {
          statusDot.className = 'dot';
          statusLabel.textContent = 'Reintentando conexión...';
          connectCard.style.display = 'flex';
          cardTitle.textContent = 'Conectando con el Emisor...';
          cardDesc.textContent = `Buscando señal activa en la sala "${targetRoomId}". Verifica que el emisor haya pulsado "Transmitir Pantalla".`;
        }
      });
    }

    function openDataChannel() {
      if (!peer || !targetRoomId) return;

      try {
        dataConn = peer.connect(targetRoomId, { reliable: true });

        dataConn.on('open', () => {
          if (!hasReceivedFrames) {
            statusLabel.textContent = 'Conectado. Recibiendo señal...';
            cardTitle.textContent = 'Conectado con el Emisor';
            cardDesc.textContent = 'Abriendo flujo de video y audio...';
          }
          dataConn.send({ type: 'REQUEST_STREAM' });
        });

        dataConn.on('data', (data) => {
          if (!data) return;
          if (data.type === 'WAITING_STREAM') {
            cardTitle.textContent = 'Dentro de la sala — Esperando captura';
            cardDesc.textContent = 'Estás conectado. En cuanto el emisor pulse "Transmitir Pantalla + Audio", verás la película.';
          } else if (data.type === 'STREAM_READY') {
            initiateDirectMediaCall();
          } else if (data.type === 'STREAM_STOPPED') {
            hasReceivedFrames = false;
            remoteVideo.srcObject = null;
            connectCard.style.display = 'flex';
            cardTitle.textContent = 'Captura en pausa';
            cardDesc.textContent = 'El emisor detuvo la captura temporalmente.';
          } else if (data.type === 'ROOM_CLOSED') {
            leaveRoom();
            cardTitle.textContent = 'El emisor cerró la sala';
            cardDesc.textContent = 'La sesión ha finalizado.';
          }
        });
      } catch (e) {}
    }

    // Activar sonido y reproducción con gesto del usuario (Desbloquea Safari iOS y Chrome Android/PC)
    unmuteBanner.addEventListener('click', () => {
      remoteVideo.muted = false;
      remoteVideo.volume = parseFloat(volumeSlider.value) || 1;
      remoteVideo.play().catch(() => {});
      unmuteBanner.style.display = 'none';
      updateMuteUI();
    });

    function updateMuteUI() {
      if (remoteVideo.muted || remoteVideo.volume === 0) {
        muteBtn.textContent = '🔇';
      } else {
        muteBtn.textContent = '🔊';
      }
    }

    muteBtn.addEventListener('click', () => {
      remoteVideo.muted = !remoteVideo.muted;
      if (!remoteVideo.muted) {
        remoteVideo.play().catch(() => {});
        unmuteBanner.style.display = 'none';
      }
      updateMuteUI();
    });

    volumeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      remoteVideo.volume = val;
      remoteVideo.muted = val === 0;
      volumeLabel.textContent = `${Math.round(val * 100)}%`;
      if (val > 0) {
        unmuteBanner.style.display = 'none';
      }
      updateMuteUI();
    });

    fullscreenBtn.addEventListener('click', () => {
      if (remoteVideo.webkitEnterFullscreen) {
        // Soporte nativo de pantalla completa para iPhone / Safari iOS
        remoteVideo.webkitEnterFullscreen();
      } else if (!document.fullscreenElement) {
        stage.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    remoteVideo.addEventListener('dblclick', () => {
      fullscreenBtn.click();
    });

    pipBtn.addEventListener('click', async () => {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (remoteVideo.readyState >= 1) {
          await remoteVideo.requestPictureInPicture();
        }
      } catch (e) {}
    });

    reconnectBtn.addEventListener('click', () => {
      const code = targetRoomId || roomInput.value.trim();
      if (code) {
        connectToBroadcaster(code);
      }
    });

    leaveBtnTop.addEventListener('click', leaveRoom);
    leaveBtnBottom.addEventListener('click', leaveRoom);

    toggleStatsBtn.addEventListener('click', () => {
      const visible = statsPopover.style.display === 'block';
      statsPopover.style.display = visible ? 'none' : 'block';
    });

    joinBtn.addEventListener('click', () => {
      const code = roomInput.value.trim();
      if (code) {
        connectToBroadcaster(code);
      }
    });

    roomInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        joinBtn.click();
      }
    });

    // Auto-ocultar controles cuando el ratón no se mueve
    let uiTimeout = null;
    stage.addEventListener('mousemove', () => {
      stage.classList.remove('hide-ui');
      clearTimeout(uiTimeout);
      if (connectCard.style.display === 'none') {
        uiTimeout = setTimeout(() => {
          if (statsPopover.style.display !== 'block') {
            stage.classList.add('hide-ui');
          }
        }, 3000);
      }
    });

    // Telemetría de recepción en vivo
    setInterval(async () => {
      if (!currentCall || !currentCall.peerConnection) return;

      try {
        const stats = await currentCall.peerConnection.getStats();
        const now = performance.now();
        const elapsedSec = (now - lastStatsTime) / 1000;

        stats.forEach(report => {
          if (report.type === 'inbound-rtp' && report.kind === 'video') {
            const bytes = report.bytesReceived || 0;
            if (bytes > 1000) {
              hasReceivedFrames = true;
            }
            if (elapsedSec > 0 && lastVideoBytes > 0) {
              const mbps = (((bytes - lastVideoBytes) * 8) / elapsedSec / 1_000_000).toFixed(2);
              statBitrate.textContent = `${mbps} Mbps`;
              liveQualityBadge.textContent = `${report.frameHeight ? report.frameHeight + 'p' : 'HD'} • ${mbps} Mbps`;
            }
            lastVideoBytes = bytes;

            if (report.frameWidth && report.frameHeight) {
              statRes.textContent = `${report.frameWidth}×${report.frameHeight}`;
            }
            if (report.framesPerSecond !== undefined) {
              statFps.textContent = `${Math.round(report.framesPerSecond)} FPS`;
            }
          }

          if (report.type === 'inbound-rtp' && report.kind === 'audio') {
            const bytes = report.bytesReceived || 0;
            if (elapsedSec > 0 && lastAudioBytes > 0) {
              const kbps = Math.round(((bytes - lastAudioBytes) * 8) / elapsedSec / 1000);
              statAudioBitrate.textContent = `${kbps} kbps Estéreo`;
            }
            lastAudioBytes = bytes;
          }

          if (report.type === 'candidate-pair' && report.state === 'succeeded' && report.currentRoundTripTime !== undefined) {
            statPing.textContent = `${Math.round(report.currentRoundTripTime * 1000)} ms`;
          }
        });

        lastStatsTime = now;
      } catch (e) {}
    }, 1000);

    // Leer automáticamente ?sala=... de la URL al abrir el enlace
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const roomFromUrl = params.get('sala') || params.get('id') || params.get('room');
      if (roomFromUrl) {
        roomInput.value = roomFromUrl;
        connectToBroadcaster(roomFromUrl);
      }
    });
  </script>
</body>
</html>
